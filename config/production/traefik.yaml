log:
  level: INFO  # ERROR, DEBUG, PANIC, FATAL, ERROR, WARN, INFO
  filePath: "/var/log/traefik/traefik.log"
  format: json
  maxSize: 1
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
providers:
  docker:
    exposedByDefault: false
    endpoint: 'unix:///var/run/docker.sock'
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true
api:
  dashboard: true
  insecure: true
serversTransport:
  insecureSkipVerify: true
entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https      
  websecure:
    address: ':443'
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
    http:
      tls:
        certResolver: cloudflare
      middlewares:
        - "crowdsec@file"
        - "cloudflarewarp@file"
  ssh:
    address: ':22'
certificatesResolvers:
  # letsencrypt:
  #   acme:
  #     caServer: https://acme-v02.api.letsencrypt.org/directory
  #     storage: /etc/traefik/acme.json
  #     tlsChallenge: {}
  cloudflare:
    acme:
      email: gpcortes@gmail.com
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        #disablePropagationCheck: true 
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
global:
  checkNewVersion: true
  sendAnonymousUsage: true
experimental:
  plugins:
    keycloakopenid:
      moduleName: "github.com/Gwojda/keycloakopenid"
      version: "v0.1.35"
    
    header-rewrite-traefik-plugin:
      moduleName: "github.com/che-incubator/header-rewrite-traefik-plugin"
      version: "v0.1.2"
    
    cloudflarewarp:                                                                   # CHANGE MADE HERE (PLUGINS ENABLED) !!!
      modulename: github.com/BetterCorp/cloudflarewarp                                # CHANGE MADE HERE (PLUGINS ENABLED) !!!
      version: v1.3.3                                                                 # CHANGE MADE HERE (PLUGINS ENABLED) !!!

    bouncer:                                                                          # CHANGE MADE HERE (PLUGINS ENABLED) !!!
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin             # CHANGE MADE HERE (PLUGINS ENABLED) !!!
      version: v1.3.3